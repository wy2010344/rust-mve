[package]
name = "wy-app"
description = "示例应用与工具"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wy-signal = { workspace = true }
wy-layout = { workspace = true }
wy-render = { workspace = true }
wy-text = { workspace = true }
wy-engine = { workspace = true }
wy-mve = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
# 行情示例（examples/finance）：只拉币安公开数据，不参与库编译。
ureq = { workspace = true }
serde_json = { workspace = true }

# ---------------------------------------------------------------------------
# 示例入口的两种组织方式（Cargo 的自动发现规则不同，容易混淆）
#
# 1. `examples/<name>/main.rs` —— **目录即示例**，自动发现，不必声明。
#    本 crate 的 `finance` / `shadcn` / `canvas2-demo` / `canvas2-todo` 都是这种。
# 2. `examples/<dir>/<file>.rs` —— **散文件放子目录**，不会被自动发现，
#    必须逐条声明 `path`。下面的 `node2-*` 属于这种：几个最小示例平级摆放，
#    共用同目录的 `theme.rs`（各示例 `mod theme;`，它不是示例本体）。
# ---------------------------------------------------------------------------
[[example]]
name = "node2-counter"
path = "examples/node2/counter.rs"

[[example]]
name = "node2-todo"
path = "examples/node2/todo.rs"

[[example]]
name = "node2-scroll"
path = "examples/node2/scroll.rs"

[[example]]
name = "node2-abs"
path = "examples/node2/abs.rs"
