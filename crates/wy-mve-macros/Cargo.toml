[package]
name = "wy-mve-macros"
description = "rsx! 声明式 UI 宏（proc-macro），对齐 Dioxus rsx! 风格"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "printing", "proc-macro", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"