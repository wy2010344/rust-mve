[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wy2010344/rust-mve"
homepage = "https://github.com/wy2010344/rust-mve"
description = "纯 Rust 信号驱动的声明式 UI 框架：MVE 响应式 + 自研一维布局 + Vello/wgpu 渲染"

[workspace.dependencies]
# 内部 crate
wy-signal = { path = "crates/wy-signal" }
wy-mve = { path = "crates/wy-mve" }
wy-mve-macros = { path = "crates/wy-mve-macros" }
wy-layout = { path = "crates/wy-layout" }
wy-render = { path = "crates/wy-render" }
wy-text = { path = "crates/wy-text" }
wy-engine = { path = "crates/wy-engine" }

# 渲染
vello = "0.10"
wgpu = "29"
winit = "0.30"

# 文本
parley = { version = "0.11", features = ["accesskit", "complex-scripts"] }
swash = "0.2"
fontique = "0.11"

# 无障碍
accesskit = "0.24"
accesskit_winit = "0.33"

# 工具
log = "0.4"
env_logger = "0.11"
thiserror = "2"
pollster = "0.4"
arboard = "3.6"

# 文本边界
unicode-segmentation = "1.12"

# 离屏渲染出图（README 配图 / CI 截图）
png = "0.18"

# 行情示例：币安公开 REST（ureq 默认走 rustls，不依赖系统 OpenSSL）
ureq = "2"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
